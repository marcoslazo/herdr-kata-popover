id = "kata.popover"
name = "Kata Popover"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Ctrl-click a kata issue ref in any pane to see its details without leaving the pane."
platforms = ["linux", "macos"]

[[actions]]
id = "show-kata"
title = "Show kata issue"
contexts = ["pane", "workspace"]
command = ["bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/show-kata.sh\""]

[[panes]]
id = "detail"
title = "Kata"
# Split, not popup: Herdr does not route Ctrl-clicks originating inside a plugin
# popup, so the linked issues rendered in one would be dead links. Walking
# related/blocking issues means clicking refs inside this pane.
placement = "split"
# The path must be absolute: the action passes --cwd (so an unqualified ref can
# resolve through that directory's .kata.toml), which means a relative path
# would resolve against the clicked pane's directory instead.
#
# env has to come first: bash prints a setlocale warning at startup when it
# inherits macOS's locale, before any command inside -c can fix it.
command = ["env", "LC_ALL=en_US.UTF-8", "bash", "-c", "exec bash \"$HERDR_PLUGIN_ROOT/scripts/detail.sh\""]

[[link_handlers]]
id = "kata"
title = "Show kata issue"
# https://kata.invalid/<project>/<short_id> is the canonical form: agents write it
# as a markdown link and this plugin emits it as OSC 8. The project segment is
# optional; without it the ref resolves through the clicked pane's .kata.toml.
# kata:// is claimed too, in case Herdr ever routes custom schemes. .invalid is
# reserved (RFC 2606), so a click the plugin misses cannot reach a real site.
pattern = "^(kata://|https?://kata\\.invalid/)([A-Za-z0-9][A-Za-z0-9._-]*/)?[a-z0-9]{4,12}/?$"
action = "show-kata"
